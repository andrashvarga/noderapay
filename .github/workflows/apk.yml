# Сборка Nodera Pay. APK попадает в артефакт запуска и в релиз «latest» (прямая ссылка для установки).
name: Build APK
on:
  push:
    branches: [main, claude/project-thread-ypu7dv, claude/project-thread-q2hge3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      # Один и тот же отладочный ключ между сборками, чтобы новая версия ставилась поверх старой.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: noderapay-debug-keystore-v1
      # Боевая подпись (по желанию): секреты NP_KEYSTORE_B64, NP_KEYSTORE_PASSWORD, NP_KEY_ALIAS, NP_KEY_PASSWORD.
      - name: Release keystore
        env: { KS: "${{ secrets.NP_KEYSTORE_B64 }}" }
        if: ${{ env.KS != '' }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$RUNNER_TEMP/release.jks" "${{ secrets.NP_KEYSTORE_PASSWORD }}" "${{ secrets.NP_KEY_ALIAS }}" "${{ secrets.NP_KEY_PASSWORD }}" > keystore.properties
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Collect
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/NoderaPay.apk
          (cd out && sha256sum NoderaPay.apk > SHA256SUMS)
          # update.json: приложение по нему узнаёт о новой версии (код, хэш, ссылка, список изменений).
          SHA=$(cut -d' ' -f1 out/SHA256SUMS)
          jq --arg sha "$SHA" --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/NoderaPay.apk" '{sha256:$sha, apkUrl:$url, releases:.}' app/src/main/assets/changelog.json > out/update.json
      - uses: actions/upload-artifact@v4
        with: { name: NoderaPay-apk, path: out/ }
      # Релиз «latest» (по нему приложения обновляются у всех) обновляет только main; ветки пишут артефакт.
      - name: Publish release
        if: ${{ github.ref == 'refs/heads/main' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          for i in 1 2 3; do gh release create latest out/NoderaPay.apk out/SHA256SUMS out/update.json --title "Nodera Pay (последняя сборка)" --notes "Сборка от ${GITHUB_SHA::7}. Установка: скачайте NoderaPay.apk на телефон и откройте (разрешите установку из этого источника)." && break; sleep 10; done
